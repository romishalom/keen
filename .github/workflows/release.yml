name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-package:
    name: Package (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build binaries
        run: cargo build --release --target ${{ matrix.target }}

      - name: Run package-release.sh
        shell: bash
        run: |
          chmod +x scripts/package-release.sh
          
          # Extract version
          VERSION="${GITHUB_REF#refs/tags/v}"

          # Run your script
          ./scripts/package-release.sh --target ${{ matrix.target }} --out dist

          # Safely handle Windows .exe extension and checksums
          if [[ "${{ matrix.target }}" == *-windows-* ]]; then
            TARGET_FILE="dist/whet/$VERSION/whet-${{ matrix.target }}"
            EXE_FILE="${TARGET_FILE}.exe"
            
            # Only rename if the non-exe file exists and the .exe version doesn't
            if [ -f "$TARGET_FILE" ] && [ ! -f "$EXE_FILE" ]; then
              mv "$TARGET_FILE" "$EXE_FILE"
            fi
            
            # Generate the correct .sha256 for the .exe file
            if [ -f "$EXE_FILE" ]; then
              (cd dist/whet/$VERSION && sha256sum "$(basename "$EXE_FILE")" > "$(basename "$EXE_FILE").sha256")
              # Remove the old non-exe checksum file if it was created
              rm -f "${TARGET_FILE}.sha256"
            fi
          fi

      - name: Upload artifact fragment
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/*

  release:
    name: Publish GitHub Release
    needs: build-and-package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifact fragments
        uses: actions/download-artifact@v4
        with:
          path: all-dist

      - name: Merge all dist folders
        run: |
          mkdir -p final-dist
          cp -r all-dist/dist-*/* final-dist/ || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "v0.3.0 - Initial Release"
          body_path: RELEASE_NOTES.md
          files: |
            final-dist/**/*
          draft: false
          prerelease: false